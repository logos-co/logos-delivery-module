<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 10, "skipped": 0}, "tutorials": [{"meta": {"name": "Running This Delivery Module Against logoscore", "output": "delivery-module-runtime.md"}, "rows": [{"execs": [], "md": "# Running This Delivery Module Against logoscore\n\n`logos-delivery-module` is a Logos `core` module that wraps\n[liblogosdelivery](https://github.com/logos-messaging/logos-delivery) to provide\nhigh-level message-delivery capabilities. This doc-test exercises **this**\ndelivery-module commit end-to-end through the headless `logoscore` runtime:\n\n1. Build the `logoscore` CLI and the `lgpm` local package manager from their\n   published flakes. `logoscore` is the headless frontend for `logos-liblogos`,\n   so building it brings in the whole module-runtime stack (`logos_host`,\n   `liblogos_core`, the IPC layer).\n2. Build **this** delivery module as an installable `.lgx` package straight from\n   its own flake's `#lgx` output, **pinned to the commit under test** \u2014 so the\n   module you run is built from exactly what is checked out here, not the latest\n   published release.\n3. Install the `.lgx` into a `./modules` directory with `lgpm`, together with\n   the optional `libp2p_module` and RLN modules `delivery_module` can use.\n4. Start `logoscore` in daemon mode (`-D`), load `delivery_module`, introspect\n   it with `module-info`, call `createNode` with a Waku node config, then call\n   `start` \u2014 verifying the module actually runs and boots a delivery node.\n\nBecause the module is built from the commit under test and then loaded and called\nthrough a real `logoscore` daemon, a green run is real evidence that this change\nkeeps the delivery module loadable and callable.\n\nOn Windows, CI cross-builds the module and uses a staged native `logoscore`\nhost to create a node without RLN (Rate Limiting Nullifier), the optional\nrate-limiting feature, and without `libp2p_module`, which has no Windows\nbuild. That leg uses an offline config, verifies RLN stays disabled, and\nstops before `start`, which requires network access.\n\n**What you'll build:** This `delivery_module`, packaged as `.lgx` and installed with `lgpm` on Linux/macOS, then loaded by a native `logoscore` daemon on Windows.\n\n**What you'll learn:**\n\n- How to build the `logoscore` runtime and the `lgpm` package manager from their flakes\n- How a module's flake exposes a ready-to-install `.lgx` via its `#lgx` output\n- How to install an `.lgx` into a modules directory with `lgpm`\n- How a module's declared dependencies have to be installed alongside it\n- How to start the `logoscore` daemon, load a module, introspect it, and call its methods\n- How to create and start a delivery node with `createNode` and `start`\n- How to shut the daemon down and confirm it has exited\n- How to load the module and create a node on Windows without its optional RLN rate-limiting dependency\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine for the package walkthrough.** The Windows section runs in CI against staged cross-built artifacts."}, {"execs": [], "md": "## Step 1: Build logoscore\n\nBuild the `logoscore` CLI from its published flake. The result is symlinked to\n`./logos/`. `logoscore` is the headless frontend for `logos-liblogos`, so this\none build brings in the whole module-runtime stack the daemon needs."}, {"execs": [], "md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus bundled runtime libraries\nand a `logos/modules/` directory containing the built-in\n`capability_module` (required for the auth handshake when loading\nmodules)."}, {"execs": [], "md": "## Step 2: Build the lgpm package manager\n\n`lgpm` installs `.lgx` packages into a modules directory and scans what is\ninstalled. Build it from the `logos-package-manager` flake and link it as\n`./lgpm`."}, {"execs": [], "md": "### 2.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe executable is at `./lgpm/bin/lgpm`."}, {"execs": [], "md": "## Step 3: Build and install this delivery module\n\nBuild **this** delivery module's `.lgx` straight from its flake's `#lgx`\noutput and install it into a local `./modules` directory with `lgpm`, along\nwith the optional `libp2p_module` and RLN modules. Every module built with\n[`logos-module-builder`](https://github.com/logos-co/logos-module-builder)\nexposes a ready-to-install `#lgx`.\n\n> The `` in the URL is what pins the build to a specific commit: the\n> doc-test runner expands it to a concrete ref. Locally that is this\n> checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested. With\n> no pin it falls back to the latest `master`."}, {"execs": [], "md": "### 3.1 Build the module's .lgx\n\nBuild the `#lgx` output and link it as `./delivery-lgx`. (This compiles\nthe module and its SDK dependencies through Nix, so the first build is\nslow.)\n\n```bash\n# From inside the clone this is simply: nix build '.#lgx'\nnix build 'github:logos-co/logos-delivery-module#lgx' -o delivery-lgx\n```\n\nThe `.lgx` package is now under `./delivery-lgx/`:\n\n```bash\nls delivery-lgx/*.lgx\n```"}, {"execs": [], "md": "### 3.2 Build the libp2p dependency\n\n`libp2p_module` is an optional dependency of `delivery_module`: it\nhosts external service discovery. A node configured for that\n(`plugin-kad-discovery`) fails to start without it; any other node\nruns without it. Build it at the rev this module's `flake.lock` pins\nfor it. From a clone, this flake re-exports the\nsame package \u2014 `nix build '.#libp2p_module-lgx'` \u2014 which reads the\npin straight out of the lock.\n\nThe second command builds the module's `#lib` without linking it.\nThe `.lgx` is a development package: its libraries load their own\ndependencies (on Linux, `libtinycbor`) from the Nix store rather\nthan carrying them. The package is compressed, so Nix cannot see\nthose references and never fetches them; building `#lib` brings\nthem into the store.\n\n```bash\nnix build 'git+https://github.com/logos-co/logos-libp2p-module?rev=7d78bb772b8c728ca3ea881158057f6faf9eda24#lgx' -o libp2p-lgx\nnix build 'git+https://github.com/logos-co/logos-libp2p-module?rev=7d78bb772b8c728ca3ea881158057f6faf9eda24#lib' --no-link\n\n```\n\nOne more `.lgx` package:\n\n```bash\nls libp2p-lgx/*.lgx\n```"}, {"execs": [], "md": "### 3.3 Build the RLN dependency chain\n\n`liblogos_rln_module` is an optional dependency of `delivery_module`:\na node whose preset has RLN off loads without it. A node on an\nRLN-enabled preset needs the whole chain installed alongside it \u2014\n`liblogos_rln_module` \u2192 `liblogos_lez_rln_module` \u2014 so\nthis walkthrough installs it too.\n\nEach is built at the rev this module's `flake.lock` pins for it, so\nthe RLN modules you install are the ones the delivery module was\nbuilt against. From a clone, this flake re-exports the same two\npackages \u2014 `nix build '.#liblogos_rln_module-lgx'`, and likewise for\n`liblogos_lez_rln_module` \u2014 which reads the pins\nstraight out of the lock.\n\n```bash\nnix build 'git+https://github.com/logos-co/logos-rln-modules?ref=main&rev=65697028baffc072e1aeebaec7c7e35e7e12cab1&dir=logos-rln-module#lgx' -o rln-lgx\nnix build 'git+https://github.com/logos-co/logos-rln-modules?ref=main&rev=9583801fae795b6d5fd5bfe8d4f407d14d859b9f&dir=logos-lez-rln-module#lgx' -o lez-rln-lgx\n\n```\n\nTwo more `.lgx` packages, one per module in the chain:\n\n```bash\nls rln-lgx/*.lgx lez-rln-lgx/*.lgx\n```"}, {"execs": [], "md": "### 3.4 Seed the modules directory with the bundled capability module\n\n`delivery_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```"}, {"execs": [], "md": "### 3.5 Install the .lgx packages with lgpm\n\nInstall the freshly-built packages into `./modules`. These are all\n`core` modules, so they go to `--modules-dir`. The packages are\nunsigned (local dev builds), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file libp2p-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file lez-rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file delivery-lgx/*.lgx\n\n```"}, {"execs": [], "md": "### 3.6 Confirm the install\n\nScan the directory and confirm all five modules landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [], "md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `delivery_module`, introspect it, create a node from a\nWaku config, and start it. Daemon output is captured in `logs.txt`."}, {"execs": [], "md": "### 4.1 Write the node config\n\nCreate `waku-config.json` \u2014 a `logos.dev` network configuration for the\ndelivery node: cluster 2 with 8 auto-shards, relay/filter/lightpush\nenabled, mix routing, and discv5 discovery.\n\n> Extended Kademlia discovery (`enableKadDiscovery` +\n> `kadBootstrapNodes`) is intentionally omitted here. The node's\n> `start` performs a **blocking** Kademlia DHT bootstrap that only\n> returns once the DHT is joined; in a headless/CI run that bootstrap\n> does not complete, so `start` never returns and the call times out.\n> discv5 (plus the relay/rendezvous peers) is enough to join the\n> network for this doc-test. See `tests/test_delivery_start_hang.cpp`.\n\n```json\n{\n  \"tcpPort\": 30303,\n  \"discv5UdpPort\": 9000,\n  \"nodekey\": \"b9800176f31e41304dff5d385944c349300204361fca56beec956b7181fbc5ae\",\n  \"clusterId\": 2,\n  \"numShardsInNetwork\": 8,\n  \"maxConnections\": 300,\n  \"relay\": true,\n  \"store\": false,\n  \"filter\": true,\n  \"lightpush\": true,\n  \"logLevel\": \"DEBUG\",\n  \"websocketSupport\": true,\n  \"websocketPort\": 8000,\n  \"websocketSecureSupport\": false,\n  \"discv5Discovery\": true,\n  \"mix\": true,\n  \"mixkey\": \"fc2d71d52cdd37cb49cca3f6a8e6877f40bc999ed67ab5808bb3b9f685cf0f94\",\n  \"nat\": \"extip:138.68.122.137\",\n  \"extMultiaddrs\": [\"/dns4/delivery-01.do-ams3.logos.dev.status.im/tcp/30303\"]\n}\n```"}, {"execs": [], "md": "### 4.2 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`."}, {"execs": [], "md": "```bash\nsleep 3\n```"}, {"execs": [], "md": "### 4.3 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```"}, {"execs": [], "md": "### 4.4 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```"}, {"execs": [], "md": "### 4.5 List discovered modules\n\n`delivery_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```"}, {"execs": [], "md": "### 4.6 Load the module\n\nLoad `delivery_module` into the running daemon. Its dependencies are\nall optional, so the host loads this module plus whichever of them are\ninstalled:\n\n```bash\nlogoscore load-module delivery_module\n```"}, {"execs": [], "md": "### 4.7 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```"}, {"execs": [], "md": "### 4.8 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info delivery_module\n```"}, {"execs": [], "md": "### 4.9 Create the delivery node\n\n`createNode` takes a Waku node configuration JSON document and creates a\nliblogosdelivery node context. The `@` prefix tells `logoscore` to load\nthe file contents as the argument:\n\n```bash\nlogoscore call delivery_module createNode @waku-config.json\n```"}, {"execs": [], "md": "```bash\nsleep 5\n```"}, {"execs": [], "md": "### 4.10 Start the delivery node\n\n`start` boots the node created by `createNode`. This is a synchronous call\nthat returns when the node has started:\n\n```bash\nlogoscore call delivery_module start\n```"}, {"execs": [], "md": "### 4.11 Review daemon logs after node start\n\nCheck the daemon output for node startup activity:\n\n```bash\ncat logs.txt\n```"}, {"execs": [], "md": "### 4.12 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits."}, {"execs": [], "md": "```bash\nsleep 5\n```"}, {"execs": [], "md": "### 4.13 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```"}, {"execs": [], "md": "## Step 5: Create a Windows node without the optional RLN module\n\nCI stages the Windows module, its DLLs, and a native `logoscore` host.\nCopy the module into the host's scan directory, then use a private daemon\nconfiguration directory and an offline node config. The shared Windows\nrunner provides `run` to launch each staged executable."}, {"execs": [{"cmd": "check file: windows-logoscore/modules/delivery_module/manifest.json", "exit_code": 0, "kind": "check_file", "output": "windows-logoscore/modules/delivery_module/manifest.json\n", "status": "pass"}], "md": "### 5.1 Stage the delivery module\n\n```bash\ntest ! -e windows-logoscore/modules/delivery_module &&\n  cp -R install-portable/modules/delivery_module windows-logoscore/modules/delivery_module\n\n```"}, {"execs": [{"cmd": "write windows-smoke-node.json", "exit_code": 0, "kind": "file", "output": "wrote windows-smoke-node.json\n", "status": "pass"}], "md": "### 5.2 Write an offline node config\n\n```json\n{\"logLevel\":\"INFO\"}\n```"}, {"execs": [{"cmd": "./windows-logoscore/bin/logoscore.exe -D -m ./windows-logoscore/modules --config-dir ./windows-smoke-config > windows-smoke-daemon.log 2>&1 &\n", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "### 5.3 Start the Windows daemon\n\n```bash\n./windows-logoscore/bin/logoscore.exe -D -m ./windows-logoscore/modules --config-dir ./windows-smoke-config > windows-smoke-daemon.log 2>&1 &\n\n```"}, {"execs": [{"cmd": "ready=0\nfor attempt in $(seq 1 20); do\n  if run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config status | grep -qF '\"status\":\"running\"'; then\n    ready=1\n    break\n  fi\n  sleep 1\ndone\nif [ \"$ready\" -eq 1 ]; then echo 'daemon ready'; else cat windows-smoke-daemon.log; false; fi\n", "exit_code": 0, "kind": "run", "output": "daemon ready\n", "status": "pass"}], "md": "### 5.4 Wait for the daemon\n\n```bash\nready=0\nfor attempt in $(seq 1 20); do\n  if run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config status | grep -qF '\"status\":\"running\"'; then\n    ready=1\n    break\n  fi\n  sleep 1\ndone\nif [ \"$ready\" -eq 1 ]; then echo 'daemon ready'; else cat windows-smoke-daemon.log; false; fi\n\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config list-modules", "exit_code": 0, "kind": "run", "output": "[{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.1.0\"},{\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.3.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 5.5 Discover the module\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config list-modules\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config load-module delivery_module", "exit_code": 0, "kind": "run", "output": "{\"dependencies_loaded\":[],\"module\":\"delivery_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.3.0\"}\n", "status": "pass"}], "md": "### 5.6 Load the module without its optional RLN dependency\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config load-module delivery_module\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config module-info delivery_module", "exit_code": 0, "kind": "run", "output": "{\"dependencies\":[],\"dependents\":[],\"events\":[{\"description\":\"@brief Emitted when a send is held back because the epoch's rate-limit\\nbudget is spent.\\n\\nNot a failure: the message stays queued and goes out once the budget\\nrefills, so @ref messagePropagated and @ref messageSent still follow.\\nEmitted at most once per send, the first time the message is held back.\",\"name\":\"messageQueued\",\"parameters\":[{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"messageHash\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"messageQueued(tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when the network has validated a sent message.\\n\\nThe success terminal state for @ref send, usually preceded by\\n@ref messagePropagated.\",\"name\":\"messageSent\",\"parameters\":[{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"messageHash\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"messageSent(tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when the module could not send a message; `error` carries the reason.\",\"name\":\"messageError\",\"parameters\":[{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"messageHash\",\"type\":\"tstr\"},{\"name\":\"error\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"messageError(tstr,tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when a message has reached the network but is not yet validated.\",\"name\":\"messagePropagated\",\"parameters\":[{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"messageHash\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"messagePropagated(tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when a message arrives on a subscribed content topic.\\n\\n`payload` is delivered as raw bytes, already decoded from the wire\\nencoding.\\n\\n`source` is `\\\"live\\\"` when the message was delivered as it was published,\\nor `\\\"history\\\"` when Store catch-up recovered it \u00e2\u20ac\u201d at startup, or after a\\nconnectivity gap. Catch-up is on by default, so a restart replays what\\nwas missed while the node was down. Upstream suppresses duplicates only\\nfor a few minutes and only in memory, so a consumer that needs each\\nmessage once must deduplicate by `messageHash`.\",\"name\":\"messageReceived\",\"parameters\":[{\"name\":\"messageHash\",\"type\":\"tstr\"},{\"name\":\"contentTopic\",\"type\":\"tstr\"},{\"name\":\"payload\",\"type\":\"bstr\"},{\"name\":\"source\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"messageReceived(tstr,tstr,bstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when the node's connectivity changes.\\n\\nA node configured with `anonymityLevel` above `\\\"None\\\"` reports\\ndisconnected until a mix exit is ready, since it cannot send anonymously\\nbefore that.\",\"name\":\"connectionStateChanged\",\"parameters\":[{\"name\":\"connectionStatus\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"connectionStateChanged(tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when a message arrives on an open reliable channel.\\n\\n`senderId` is the sending participant's SDS identifier. `payload` is\\ndelivered as raw bytes, already decoded from the wire encoding.\",\"name\":\"channelMessageReceived\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"},{\"name\":\"senderId\",\"type\":\"tstr\"},{\"name\":\"payload\",\"type\":\"bstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"channelMessageReceived(tstr,tstr,bstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted once every segment of a @ref channelSend is confirmed.\",\"name\":\"channelMessageSent\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"},{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"channelMessageSent(tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when a @ref channelSend finalises with a failed segment.\",\"name\":\"channelMessageError\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"},{\"name\":\"requestId\",\"type\":\"tstr\"},{\"name\":\"error\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"channelMessageError(tstr,tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when @ref start finishes; `message` carries the reason when `success` is false.\",\"name\":\"nodeStarted\",\"parameters\":[{\"name\":\"success\",\"type\":\"bool\"},{\"name\":\"message\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"nodeStarted(bool,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted when @ref stop finishes; `message` carries the reason when `success` is false.\",\"name\":\"nodeStopped\",\"parameters\":[{\"name\":\"success\",\"type\":\"bool\"},{\"name\":\"message\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"nodeStopped(bool,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief Emitted on every RLN bring-up transition.\\n\\n`state` is one of `Disabled`, `Initializing`, `Ready` or `Failed`, and\\n`message` carries the reason on `Failed`. See @ref rlnState for what\\neach one means and when they occur.\",\"name\":\"rlnStateChanged\",\"parameters\":[{\"name\":\"state\",\"type\":\"tstr\"},{\"name\":\"message\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"rlnStateChanged(tstr,tstr,int)\",\"type\":\"event\"},{\"description\":\"@brief RLN request events, one per ABI function\\n(`liblogosdelivery_rln.h`).\\n\\nAnswer each via @ref rlnRespond with the same `reqId`. The JSON args are\\nopaque to this module (RLN module wire schema). `epochTimestamp` is the\\nUnix-seconds epoch/quota timestamp; the trailing `timestamp` is the\\nlocal emission time, as on every other event.\",\"name\":\"dispatchRlnGetMembershipStateRequestEvent\",\"parameters\":[{\"name\":\"reqId\",\"type\":\"int\"},{\"name\":\"registryId\",\"type\":\"tstr\"},{\"name\":\"rlnIdentifier\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"dispatchRlnGetMembershipStateRequestEvent(int,tstr,tstr,int)\",\"type\":\"event\"},{\"name\":\"dispatchRlnGetEpochQuotaRequestEvent\",\"parameters\":[{\"name\":\"reqId\",\"type\":\"int\"},{\"name\":\"registryId\",\"type\":\"tstr\"},{\"name\":\"rlnIdentifier\",\"type\":\"tstr\"},{\"name\":\"epochTimestamp\",\"type\":\"int\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"dispatchRlnGetEpochQuotaRequestEvent(int,tstr,tstr,int,int)\",\"type\":\"event\"},{\"name\":\"dispatchRlnGenerateProofRequestEvent\",\"parameters\":[{\"name\":\"reqId\",\"type\":\"int\"},{\"name\":\"registryId\",\"type\":\"tstr\"},{\"name\":\"rlnIdentifier\",\"type\":\"tstr\"},{\"name\":\"signalHex\",\"type\":\"tstr\"},{\"name\":\"epochTimestamp\",\"type\":\"int\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"dispatchRlnGenerateProofRequestEvent(int,tstr,tstr,tstr,int,int)\",\"type\":\"event\"},{\"name\":\"dispatchRlnValidateProofRequestEvent\",\"parameters\":[{\"name\":\"reqId\",\"type\":\"int\"},{\"name\":\"registryId\",\"type\":\"tstr\"},{\"name\":\"rlnIdentifier\",\"type\":\"tstr\"},{\"name\":\"signalHex\",\"type\":\"tstr\"},{\"name\":\"epochTimestamp\",\"type\":\"int\"},{\"name\":\"proofJson\",\"type\":\"tstr\"},{\"name\":\"timestamp\",\"type\":\"int\"}],\"signature\":\"dispatchRlnValidateProofRequestEvent(int,tstr,tstr,tstr,int,tstr,int)\",\"type\":\"event\"}],\"methods\":[{\"description\":\"@brief Creates a liblogosdelivery node from a JSON configuration.\\n\\nThe JSON passes through to logos-delivery verbatim; `parseLogosDeliveryConf`\\n(https://github.com/logos-messaging/logos-delivery) owns the grammar.\\n`entryLayer` selects how much of the stack is mounted:\\n- `\\\"kernel\\\"` \u00e2\u20ac\u201d transport node only\\n- `\\\"messaging\\\"` \u00e2\u20ac\u201d kernel + messaging client\\n- `\\\"channels\\\"` \u00e2\u20ac\u201d kernel + messaging + reliable channels (default)\\n\\nThree typical shapes:\\n\\n**App developer** \u00e2\u20ac\u201d full stack (default `entryLayer`). `preset` picks the\\nnetwork (`\\\"logos.test\\\"`, `\\\"logos.dev\\\"`, `\\\"twn\\\"`), `mode` picks the protocol\\nflags (`\\\"Core\\\"` = relay node, `\\\"Edge\\\"` = light node). Optional\\n`messagingOverrides` / `channelsOverrides` objects override per-layer\\ndefaults:\\n@code{.json}\\n{ \\\"mode\\\": \\\"Core\\\", \\\"preset\\\": \\\"logos.test\\\" }\\n@endcode\\n\\nOne such override is `anonymityLevel` \u00e2\u20ac\u201d `\\\"None\\\"` (default), `\\\"Preferred\\\"`\\nor `\\\"Required\\\"`. Anything above `\\\"None\\\"` mounts mix and routes sends\\nthrough it, so it conflicts with an explicit `\\\"mix\\\": false`.\\n`\\\"Preferred\\\"` falls back to the plain path when mix is unusable;\\n`\\\"Required\\\"` fails the send instead.\\n@code{.json}\\n{\\n\\\"mode\\\": \\\"Core\\\",\\n\\\"preset\\\": \\\"logos.test\\\",\\n\\\"messagingOverrides\\\": { \\\"anonymityLevel\\\": \\\"Required\\\" }\\n}\\n@endcode\\n\\nOther overrides worth naming: `backfillEnabled` (default `true`) runs\\nStore catch-up for the messages missed while the node was down, and\\n`backfillRequestTimeoutSeconds` bounds one Store query (default 10,\\nrange 1\u00e2\u20ac\u201c300); see @ref messageReceived for what catch-up delivers.\\n`nat` selects public-address discovery \u00e2\u20ac\u201d `\\\"any\\\"` (default), `\\\"none\\\"`,\\n`\\\"upnp\\\"`, `\\\"pmp\\\"` or `\\\"extip:<IP>\\\"`.\\n\\n**Node operator** \u00e2\u20ac\u201d kernel-only service node on a public network. `mode`\\nis not applied on this layer, so protocol flags are set explicitly in\\n`kernelConf`:\\n@code{.json}\\n{\\n\\\"entryLayer\\\": \\\"kernel\\\",\\n\\\"kernelConf\\\": { \\\"preset\\\": \\\"logos.test\\\", \\\"relay\\\": true }\\n}\\n@endcode\\n\\n**Network hoster** \u00e2\u20ac\u201d kernel-only node on a self-hosted network;\\n`kernelConf` is a raw `WakuNodeConf` used as-is:\\n@code{.json}\\n{\\n\\\"entryLayer\\\": \\\"kernel\\\",\\n\\\"kernelConf\\\": { \\\"clusterId\\\": 42, \\\"relay\\\": true, \\\"entryNodes\\\": [\\\"/dns4/\u00e2\u20ac\u00a6\\\"] }\\n}\\n@endcode\\n\\nOn kernel-only nodes `send` / `subscribe` / `channel*` fail with \\\"node has\\nno messaging client\\\" / \\\"no reliable channel manager\\\"; `getNodeInfo`,\\n`storeQuery` and metrics keep working.\\n\\nThe pre-layered flat shape (bare `WakuNodeConf` keys at top level) still\\nparses and boots the full stack.\\n\\n@param cfg UTF-8 JSON payload string.\\n@return `true` if context creation succeeds and callback returns `RET_OK`,\\notherwise `false`.\",\"isInvokable\":true,\"name\":\"createNode\",\"parameters\":[{\"name\":\"cfg\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"createNode(tstr)\"},{\"description\":\"@brief Starts the delivery node.\\n@return `true` once dispatched; completion is reported via `nodeStarted`.\",\"isInvokable\":true,\"name\":\"start\",\"returnType\":\"result\",\"signature\":\"start()\"},{\"description\":\"@brief Stops the delivery node.\\n@return `true` once dispatched; completion is reported via `nodeStopped`.\",\"isInvokable\":true,\"name\":\"stop\",\"returnType\":\"result\",\"signature\":\"stop()\"},{\"description\":\"@brief Sends a message over the active node.\\n\\nBuilds a JSON envelope expected by `logosdelivery_ctx_send`:\\n`{ \\\"contentTopic\\\": string, \\\"payload\\\": base64, \\\"ephemeral\\\": false }`.\\n\\nReturns a requestId on success. Async results come via typed events:\\n- `messageError` emitted if the module can't send the message\\n- `messageQueued` emitted if the send waits for rate-limit budget\\n- `messagePropagated` emitted if the message has hit the network\\n- `messageSent` emitted after the message is validated by the network\\n\\n@param contentTopic Destination content topic.\\n@param payload Raw message bytes; base64-encoded before crossing the FFI boundary.\\n@return Success with request id, or error details.\",\"isInvokable\":true,\"name\":\"send\",\"parameters\":[{\"name\":\"contentTopic\",\"type\":\"tstr\"},{\"name\":\"payload\",\"type\":\"bstr\"}],\"returnType\":\"result\",\"signature\":\"send(tstr,bstr)\"},{\"description\":\"@brief Subscribes to the supplied content topic.\\n@param contentTopic Topic identifier.\\n@return `true` when subscribed successfully, otherwise `false`.\",\"isInvokable\":true,\"name\":\"subscribe\",\"parameters\":[{\"name\":\"contentTopic\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"subscribe(tstr)\"},{\"description\":\"@brief Unsubscribes from the supplied content topic.\\n@param contentTopic Topic identifier.\\n@return `true` when unsubscribed successfully, otherwise `false`.\",\"isInvokable\":true,\"name\":\"unsubscribe\",\"parameters\":[{\"name\":\"contentTopic\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"unsubscribe(tstr)\"},{\"description\":\"@brief Runs a Store (historical message) query against a specific store\\nservice peer.\\n\\n\u00e2\u0161\u00a0\u00ef\u00b8\ufffd USE AT YOUR OWN RISK: backed by the kernel API (`logosdelivery_ctx_waku_store_query`,\\n`liblogosdelivery_kernel.h`), which is subject to change at any point\\nwithout a deprecation cycle. This method's JSON contract follows it.\\n\\nThe query JSON maps to logos-delivery's `StoreQueryRequest`\\n(`library/kernel_api/protocols/store_api.nim`):\\n| Key                 | Type            | Required | Description                                        |\\n|---------------------|-----------------|----------|----------------------------------------------------|\\n| `requestId`         | string          | yes      | Caller-chosen id, echoed in the response           |\\n| `includeData`       | boolean         | yes      | `true` returns full messages, `false` hashes only  |\\n| `paginationForward` | boolean         | yes      | Paging direction                                   |\\n| `pubsubTopic`       | string          | no       | Pubsub topic filter                                |\\n| `contentTopics`     | array of string | no       | Content topic filters                              |\\n| `timeStart`         | number/string   | no       | Range start, nanoseconds since Unix epoch          |\\n| `timeEnd`           | number/string   | no       | Range end, nanoseconds since Unix epoch            |\\n| `messageHashes`     | array of string | no       | Hex message hashes for lookup-by-hash queries      |\\n| `paginationCursor`  | string          | no       | Hex cursor from a previous response                |\\n| `paginationLimit`   | number          | no       | Max messages per page                              |\\n\\nOn success the result value is the response JSON (`StoreQueryResponseHex`):\\n`{ \\\"requestId\\\", \\\"statusCode\\\", \\\"statusDesc\\\", \\\"messages\\\": [ { \\\"messageHash\\\",\\n\\\"message\\\", \\\"pubsubTopic\\\" } ], \\\"paginationCursor\\\" }` with hashes 0x-hex\\nencoded.\\n\\n@param jsonQuery UTF-8 JSON query document, see above.\\n@param peerAddr Multiaddress of the store service peer to query\\n(e.g. `/ip4/127.0.0.1/tcp/60000/p2p/16Uiu2...`).\\n@param timeoutMs Query timeout in milliseconds.\\n@return Success with the response JSON, or error details.\",\"isInvokable\":true,\"name\":\"storeQuery\",\"parameters\":[{\"name\":\"jsonQuery\",\"type\":\"tstr\"},{\"name\":\"peerAddr\",\"type\":\"tstr\"},{\"name\":\"timeoutMs\",\"type\":\"int\"}],\"returnType\":\"result\",\"signature\":\"storeQuery(tstr,tstr,int)\"},{\"description\":\"@brief Creates (or re-opens) a reliable channel.\\n\\nPersisted channel state survives @ref channelClose, so re-creating a\\nchannel with the same id restores it.\\n\\n@param channelId Application-chosen channel identifier.\\n@param contentTopic Content topic the channel communicates on.\\n@param senderId This participant's SDS (Scalable Data Sync) sender identifier.\\n@return Success with the channel id, or error details.\",\"isInvokable\":true,\"name\":\"channelCreate\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"},{\"name\":\"contentTopic\",\"type\":\"tstr\"},{\"name\":\"senderId\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"channelCreate(tstr,tstr,tstr)\"},{\"description\":\"@brief Checks whether a reliable channel is currently open.\\n\\nAn unknown channel id is not an error.\\n\\n@param channelId Channel identifier.\\n@return Success with `\\\"true\\\"` or `\\\"false\\\"` (verbatim FFI string), or error details.\",\"isInvokable\":true,\"name\":\"channelExists\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"channelExists(tstr)\"},{\"description\":\"@brief Sends a message on a reliable channel.\\n\\nBuilds the JSON envelope expected by `logosdelivery_ctx_channel_send`:\\n`{ \\\"payload\\\": base64, \\\"ephemeral\\\": false }`.\\n\\nReturns a requestId on success. Async results come via typed events:\\n- `channelMessageSent` once every segment of the send is confirmed\\n- `channelMessageError` if the send finalises with a failed segment\\n\\n@param channelId Channel identifier.\\n@param payload Raw message bytes; base64-encoded before crossing the FFI boundary.\\n@return Success with request id, or error details.\",\"isInvokable\":true,\"name\":\"channelSend\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"},{\"name\":\"payload\",\"type\":\"bstr\"}],\"returnType\":\"result\",\"signature\":\"channelSend(tstr,bstr)\"},{\"description\":\"@brief Closes a reliable channel: stops its SDS loops.\\n\\nPersisted state survives, so @ref channelCreate with the same id\\nrestores the channel.\\n\\n@param channelId Channel identifier.\\n@return `true` when closed successfully, otherwise `false`.\",\"isInvokable\":true,\"name\":\"channelClose\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"channelClose(tstr)\"},{\"description\":\"@brief Lists the node info items this node advertises, for use with\\n@ref getNodeInfo.\\n\\nThe list comes back as a JSON array of strings:\\n\\n@code{.json}\\n[\\\"Version\\\", \\\"Metrics\\\", \\\"MyMultiaddresses\\\", \\\"MyENR\\\", \\\"MyPeerId\\\"]\\n@endcode\\n\\nWhich items a node advertises depends on how it was built and\\nconfigured, so treat the set as discovered rather than fixed. An\\nadvertised item may still return an empty value from @ref getNodeInfo\\nwhen the feature behind it is unconfigured.\\n\\n@return Success with the list above, or error details. Fails before\\n@ref createNode has run.\",\"isInvokable\":true,\"name\":\"getAvailableNodeInfoIDs\",\"returnType\":\"result\",\"signature\":\"getAvailableNodeInfoIDs()\"},{\"description\":\"@brief Returns information for the given node info item.\\n@param nodeInfoId Identifier for the requested node info item.\\n@return JSON data string on success, or error details.\",\"isInvokable\":true,\"name\":\"getNodeInfo\",\"parameters\":[{\"name\":\"nodeInfoId\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"getNodeInfo(tstr)\"},{\"description\":\"@brief Information about the available configuration parameters for `createNode`.\",\"isInvokable\":true,\"name\":\"getAvailableConfigs\",\"returnType\":\"result\",\"signature\":\"getAvailableConfigs()\"},{\"description\":\"@brief Returns the node's metrics as an OpenMetrics/Prometheus text\\ndocument, so the `openmetrics` module can scrape this module.\\n\\nliblogosdelivery already aggregates Prometheus metrics in its global\\nregistry and renders them as exposition text behind the `\\\"Metrics\\\"`\\nnode-info attribute. This method just hands that text back verbatim \u00e2\u20ac\u201d no\\nreshaping \u00e2\u20ac\u201d which satisfies the openmetrics `metrics_source` interface's\\n`collectOpenMetricsText()` convention. The openmetrics scraper parses the\\ntext, injects a `module=\\\"delivery_module\\\"` label on every series, and\\nmerges it with other modules. Select this method per-module in the\\nopenmetrics `start` config with `{\\\"name\\\":\\\"delivery_module\\\",\\\"format\\\":\\\"text\\\"}`.\\n\\nReturns an empty string before a node has been created, or when the\\nunderlying read fails, so a scrape never errors out on this module.\\n\\n@return OpenMetrics/Prometheus exposition text (possibly empty).\",\"isInvokable\":true,\"name\":\"collectOpenMetricsText\",\"returnType\":\"tstr\",\"signature\":\"collectOpenMetricsText()\"},{\"description\":\"@brief Completes an outstanding RLN request (see the `rln*Request` events).\\n\\nThe delivery library outsources RLN operations to an external RLN\\nmodule; this module facilitates that message passing. When the delivery\\nlibrary makes an RLN request, this module emits the matching\\n`rln*Request` event. This method takes the reqId of the original\\nrequest along with the response and passes it on to the library\\nverbatim \u00e2\u20ac\u201d the wire schema is owned by the RLN module and the delivery\\nlibrary, not modelled here.\\n\\nOn a node running lez RLN the in-process bridge (see\\n@ref rlnBridgeEnable) answers each request itself; only the first\\nresponse per reqId is accepted, so a second caller of this method is\\nrejected as a duplicate.\\n\\nThere is no response deadline to manage on this side: if no response\\narrives in time, the delivery library synthesizes a TRANSIENT failure\\nitself. A response for a request that already timed out (or was never\\nissued) fails with an error.\\n\\n@param reqId Request id from the `rln*Request` event. Ids >= 2^63 appear\\nnegative here (int64 view of the library's uint64 id); they are\\npassed through bit-exactly, so echo them back unchanged.\",\"isInvokable\":true,\"name\":\"rlnRespond\",\"parameters\":[{\"name\":\"reqId\",\"type\":\"int\"},{\"name\":\"resultJson\",\"type\":\"tstr\"}],\"returnType\":\"result\",\"signature\":\"rlnRespond(int,tstr)\"},{\"description\":\"@brief Enables the in-process RLN bridge.\\n\\nOnce enabled, each `rln*Request` is answered inside this module: the\\nbridge's worker threads call the co-loaded `liblogos_rln_module` and\\npass its reply back unchanged. The events keep emitting for\\nobservability, but an external responder must not also answer an\\nenabled node: its second response per reqId is rejected. Idempotent;\\ncall any time before @ref start. A preset that enables RLN does this\\nautomatically. Calling it directly is mainly for test purposes.\",\"isInvokable\":true,\"name\":\"rlnBridgeEnable\",\"returnType\":\"result\",\"signature\":\"rlnBridgeEnable()\"},{\"description\":\"@brief Where this node's RLN stands.\\n\\nRLN is not configured by a caller: @ref createNode reads the network\\n`preset` and brings RLN up for deployments whose preset enables it.\\nThe chain-touching part of that runs off the @ref createNode thread, so\\na node is created before RLN is usable and this reports the progress.\\n\\n| State | Meaning |\\n|---|---|\\n| `Disabled` | No node yet, or the node's preset carries no RLN |\\n| `Initializing` | Plugin installed, backend still coming up |\\n| `Ready` | The in-process bridge answers requests |\\n| `Failed` | Bring-up failed; `message` carries the reason |\\n\\n`Ready` means the backend started and the bridge answers. It does not\\npromise the RLN module's valid-root window is warm \u00e2\u20ac\u201d that is a\\nbackground refresh the module does not currently expose.\\n\\n@return Value `{\\\"state\\\": \\\"<state>\\\", \\\"message\\\": \\\"<detail>\\\"}`, plus\\n`registryId`, `rlnIdentifier` and `epochSizeSec` once a preset\\nhas enabled RLN \u00e2\u20ac\u201d the resolved deployment, so a caller can name\\nor query it without a second copy of the preset table.\\n@see rlnStateChanged for the same transitions as an event.\",\"isInvokable\":true,\"name\":\"rlnState\",\"returnType\":\"result\",\"signature\":\"rlnState()\"},{\"description\":\"The module's name, as declared in its metadata.\",\"isInvokable\":true,\"name\":\"name\",\"returnType\":\"tstr\",\"signature\":\"name()\"},{\"description\":\"The module's version, as declared in its metadata.\",\"isInvokable\":true,\"name\":\"version\",\"returnType\":\"tstr\",\"signature\":\"version()\"},{\"description\":\"The module's canonical LIDL interface document.\",\"isInvokable\":true,\"name\":\"lidl\",\"returnType\":\"tstr\",\"signature\":\"lidl()\"}],\"name\":\"delivery_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.3.0\"}\n", "status": "pass"}], "md": "### 5.7 Inspect the module methods\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config module-info delivery_module\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config call delivery_module createNode @windows-smoke-node.json", "exit_code": 0, "kind": "run", "output": "{\"method\":\"createNode\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Create an offline delivery node\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config call delivery_module createNode @windows-smoke-node.json\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config call delivery_module rlnState", "exit_code": 0, "kind": "run", "output": "{\"method\":\"rlnState\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"message\":\"\",\"state\":\"Disabled\"}},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.9 Confirm RLN remains disabled\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config call delivery_module rlnState\n```"}, {"execs": [{"cmd": "run windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config stop", "exit_code": 0, "kind": "run", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.10 Stop the Windows daemon\n\n```bash\nrun windows-logoscore/bin/logoscore.exe --config-dir ./windows-smoke-config stop\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
