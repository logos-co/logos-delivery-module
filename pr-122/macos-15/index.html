kgs/stdenv/generic/make-derivation.nix:539:13\n\n       \u2026 while evaluating attribute 'src' of derivation 'cargo-git-https-github.com-keycard-tech-keycard-rs-9535a657ba04b1e6916de51777e22b4837c1a84d'\n         at \u00abgithub:ipetkov/crane/59a82a1222dd3b2080b5cc52a1a2e8d5f1b77f37?narHash=sha256-D%2BBsdpxmtUwtqGoY0IXPhHgTlmqgcZKCEo1oMyn7ep0%3D\u00bb/lib/downloadCargoPackageFromGit.nix:51:3:\n           50|   name = \"${namePrefix}${nameFromUrl}-${rev}\";\n           51|   src = repo;\n             |   ^\n           52|\n\n       \u2026 while calling the 'fetchGit' builtin\n         at \u00abgithub:ipetkov/crane/59a82a1222dd3b2080b5cc52a1a2e8d5f1b77f37?narHash=sha256-D%2BBsdpxmtUwtqGoY0IXPhHgTlmqgcZKCEo1oMyn7ep0%3D\u00bb/lib/downloadCargoPackageFromGit.nix:29:7:\n           28|     if hash == null then\n           29|       builtins.fetchGit (\n             |       ^\n           30|         maybeRef\n\n       \u2026 while fetching the input 'git+https://github.com/keycard-tech/keycard-rs?rev=9535a657ba04b1e6916de51777e22b4837c1a84d&submodules=1'\n\n       error: Failed to fetch git repository 'https://github.com/keycard-tech/keycard-rs'\n", "status": "fail"}, {"cmd": "ls rln-lgx/*.lgx lez-rln-lgx/*.lgx lez-core-lgx/*.lgx", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "ls: lez-core-lgx/*.lgx: No such file or directory\nls: lez-rln-lgx/*.lgx: No such file or directory\nrln-lgx/logos-liblogos_rln_module-module-lib.lgx\n", "status": "fail"}], "md": "### 3.2 Build the RLN dependency chain\n\n`delivery_module` declares `liblogos_rln_module` in\n`metadata.json#dependencies`, and the host refuses to load a module\nwhose dependency chain is absent from the modules directory \u2014 so that\nchain has to be installed alongside it: `liblogos_rln_module` \u2192\n`liblogos_lez_rln_module` \u2192 `lez_core`.\n\nEach is built at the rev this module's `flake.lock` pins for it, so\nthe RLN modules you install are the ones the delivery module was\nbuilt against. From a clone, this flake re-exports the same three\npackages \u2014 `nix build '.#liblogos_rln_module-lgx'`, and likewise for\n`liblogos_lez_rln_module` and `lez_core` \u2014 which reads the pins\nstraight out of the lock.\n\n```bash\nnix build 'git+https://github.com/logos-co/logos-rln-modules?ref=feat/lip-alignment&rev=53d31e3d71595c481e0e1be2ebc8120d8eaf9447&dir=logos-rln-module#lgx' -o rln-lgx\nnix build 'git+https://github.com/logos-co/logos-rln-modules?ref=feat/lip-alignment&rev=c89c7691d06af32c002426f3c6f6dece79dbffaa&dir=logos-lez-rln-module#lgx' -o lez-rln-lgx\nnix build 'github:logos-blockchain/logos-execution-zone-module/0ea57f8a1c57539d6ee0961a9cd27b064685b9e8#lgx' -o lez-core-lgx\n\n```\n\nThree more `.lgx` packages, one per module in the chain:\n\n```bash\nls rln-lgx/*.lgx lez-rln-lgx/*.lgx lez-core-lgx/*.lgx\n```"}, {"execs": [{"cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.3 Seed the modules directory with the bundled capability module\n\n`delivery_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file lez-core-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file lez-rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file delivery-lgx/*.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: lez-core-lgx/*.lgx... FAILED\nError: Source plugin file does not exist or is not a file: lez-core-lgx/*.lgx\nInstalling from file: lez-rln-lgx/*.lgx... FAILED\nError: Source plugin file does not exist or is not a file: lez-rln-lgx/*.lgx\nInstalling from file: rln-lgx/logos-liblogos_rln_module-module-lib.lgx... done\nInstalled to: ./modules\nInstalling from file: delivery-lgx/logos-delivery_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 3.4 Install the .lgx packages with lgpm\n\nInstall the freshly-built packages into `./modules`. These are all\n`core` modules, so they go to `--modules-dir`. The packages are\nunsigned (local dev builds), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file lez-core-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file lez-rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file rln-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file delivery-lgx/*.lgx\n\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 4 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \ndelivery_module                0.2.1           core       protocol       \nliblogos_rln_module            0.7.0           core       blockchain     \nmodules_state                  0.1.0           core       system         \n", "status": "pass"}], "md": "### 3.5 Confirm the install\n\nScan the directory and confirm all four modules landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [], "md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `delivery_module`, introspect it, create a node from a\nWaku config, and start it. Daemon output is captured in `logs.txt`."}, {"execs": [{"cmd": "write waku-config.json", "kind": "file", "note": "Wrote waku-config.json", "status": "pass"}], "md": "### 4.1 Write the node config\n\nCreate `waku-config.json` \u2014 a `logos.dev` network configuration for the\ndelivery node: cluster 2 with 8 auto-shards, relay/filter/lightpush\nenabled, mix routing, and discv5 discovery.\n\n> Extended Kademlia discovery (`enableKadDiscovery` +\n> `kadBootstrapNodes`) is intentionally omitted here. The node's\n> `start` performs a **blocking** Kademlia DHT bootstrap that only\n> returns once the DHT is joined; in a headless/CI run that bootstrap\n> does not complete, so `start` never returns and the call times out.\n> discv5 (plus the relay/rendezvous peers) is enough to join the\n> network for this doc-test. See `tests/test_delivery_start_hang.cpp`.\n\n```json\n{\n  \"tcpPort\": 30303,\n  \"discv5UdpPort\": 9000,\n  \"nodekey\": \"b9800176f31e41304dff5d385944c349300204361fca56beec956b7181fbc5ae\",\n  \"clusterId\": 2,\n  \"numShardsInNetwork\": 8,\n  \"maxConnections\": 300,\n  \"relay\": true,\n  \"store\": false,\n  \"filter\": true,\n  \"lightpush\": true,\n  \"logLevel\": \"DEBUG\",\n  \"websocketSupport\": true,\n  \"websocketPort\": 8000,\n  \"websocketSecureSupport\": false,\n  \"discv5Discovery\": true,\n  \"mix\": true,\n  \"mixkey\": \"fc2d71d52cdd37cb49cca3f6a8e6877f40bc999ed67ab5808bb3b9f685cf0f94\",\n  \"nat\": \"extip:138.68.122.137\",\n  \"extMultiaddrs\": [\"/dns4/delivery-01.do-ams3.logos.dev.status.im/tcp/30303\"]\n}\n```"}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.2 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`."}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 3\n```"}, {"execs": [{"cmd": "cat logs.txt", "exit_code": 0, "kind": "run", "note": "", "output": "[2026-09-17 19:19:34.355] [info] Inter-module access enforcement is OFF (no access policy set): any loaded module may call any other\n[2026-09-17 19:19:34.377] [info] [logos] Granting host services to 'capability_module': token_registry,token_delivery\n[2026-09-17 19:19:34.471] [out] [capability_module] [2026-09-17 19:19:34.471] [info] Granting host services to capability_module: [\"token_registry\",\"token_delivery\"]\n[2026-09-17 19:19:34.492] [info] [logos] Module loaded: capability_module\n[2026-09-17 19:19:34.532] [info] [logos] Module loaded: modules_state\nLogosctl daemon started (pid 13570, instance d79305b2873e)\nDaemon state: /tmp/doctest-test-xa2_6x5m/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-xa2_6x5m/.logoscore/client/config.json\n[2026-09-17 19:19:34.557] [info] [logos] Pushed module snapshot to modules_state\n", "status": "pass"}], "md": "### 4.3 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":13570,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"0.1.0\"},{\"name\":\"liblogos_rln_module\",\"status\":\"not_loaded\",\"version\":\"0.7.0\"},{\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.2.1\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":2}}\n", "status": "pass"}], "md": "### 4.4 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore list-modules", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"0.1.0\"},{\"name\":\"liblogos_rln_module\",\"status\":\"not_loaded\",\"version\":\"0.7.0\"},{\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.2.1\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 4.5 List discovered modules\n\n`delivery_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore load-module delivery_module", "exit_code": 3, "kind": "run", "note": "exit code 3", "output": "{\"code\":\"MODULE_LOAD_FAILED\",\"known_modules\":[\"modules_state\",\"liblogos_rln_module\",\"delivery_module\",\"capability_module\"],\"message\":\"Failed to load module 'delivery_module'.\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 4.6 Load the module\n\nLoad `delivery_module` into the running daemon. Only this module is\nnamed \u2014 the host resolves `metadata.json#dependencies` and loads the\nRLN chain with it:\n\n```bash\nlogoscore load-module delivery_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":13570,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"0.1.0\"},{\"name\":\"liblogos_rln_module\",\"status\":\"not_loaded\",\"version\":\"0.7.0\"},{\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.2.1\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":2}}\n", "status": "pass"}], "md": "### 4.7 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore module-info delivery_module", "exit_code": 0, "kind": "run", "note": "expected 'createNode' not found in output", "output": "{\"dependencies\":[\"liblogos_rln_module\"],\"dependents\":[],\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.2.1\"}\n", "status": "fail"}], "md": "### 4.8 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info delivery_module\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call delivery_module createNode @waku-config.json", "exit_code": 3, "kind": "run", "note": "exit code 3", "output": "{\"code\":\"MODULE_NOT_LOADED\",\"message\":\"Module 'delivery_module' is not loaded. Load it with: logosctl module load delivery_module\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 4.9 Create the delivery node\n\n`createNode` takes a Waku node configuration JSON document and creates a\nliblogosdelivery node context. The `@` prefix tells `logoscore` to load\nthe file contents as the argument:\n\n```bash\nlogoscore call delivery_module createNode @waku-config.json\n```"}, {"execs": [{"cmd": "sleep 5", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 5\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore call delivery_module start", "exit_code": 3, "kind": "run", "note": "exit code 3", "output": "{\"code\":\"MODULE_NOT_LOADED\",\"message\":\"Module 'delivery_module' is not loaded. Load it with: logosctl module load delivery_module\",\"status\":\"error\"}\n", "status": "fail"}], "md": "### 4.10 Start the delivery node\n\n`start` boots the node created by `createNode`. This is a synchronous call\nthat returns when the node has started:\n\n```bash\nlogoscore call delivery_module start\n```"}, {"execs": [{"cmd": "cat logs.txt", "exit_code": 0, "kind": "run", "note": "", "output": "[2026-09-17 19:19:34.355] [info] Inter-module access enforcement is OFF (no access policy set): any loaded module may call any other\n[2026-09-17 19:19:34.377] [info] [logos] Granting host services to 'capability_module': token_registry,token_delivery\n[2026-09-17 19:19:34.471] [out] [capability_module] [2026-09-17 19:19:34.471] [info] Granting host services to capability_module: [\"token_registry\",\"token_delivery\"]\n[2026-09-17 19:19:34.492] [info] [logos] Module loaded: capability_module\n[2026-09-17 19:19:34.532] [info] [logos] Module loaded: modules_state\nLogosctl daemon started (pid 13570, instance d79305b2873e)\nDaemon state: /tmp/doctest-test-xa2_6x5m/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-xa2_6x5m/.logoscore/client/config.json\n[2026-09-17 19:19:34.557] [info] [logos] Pushed module snapshot to modules_state\n[2026-09-17 19:19:37.353] [warning] [logos] Module not found in known modules: liblogos_lez_rln_module\n[2026-09-17 19:19:37.353] [warning] [logos] Missing dependencies detected: liblogos_lez_rln_module\n[2026-09-17 19:19:37.353] [warning] [logos] Cannot resolve dependencies for: delivery_module\n", "status": "pass"}], "md": "### 4.11 Review daemon logs after node start\n\nCheck the daemon output for node startup activity:\n\n```bash\ncat logs.txt\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.12 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits."}, {"execs": [{"cmd": "sleep 5", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 5\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/nj/vtw8zd2j31d1gdrtntc5y4600000gn/T/logos_core_service_d79305b2873e). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 4.13 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
