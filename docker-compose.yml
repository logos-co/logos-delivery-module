services:
  logos-node:
    build:
      context: https://github.com/logos-co/logos-docker.git#06ada1e9ccb9993f1de1c93adf8d27959d4cc3f8
      args:
        DELIVERY_VERSION: "0.3.0"
    image: logos-node:dev-local
    container_name: logos-node
    volumes:
      - ./conf:/conf:ro
      - logos-persistence:/var/lib/logos/persistence
    ports:
      - "30303:30303/tcp"   # p2p
      - "9000:9000/udp"     # discv5
    # The image starts the logoscore daemon with
    # `--config-dir /var/lib/logos/config`. Loading the module and starting the
    # node is a one-shot step run from the host after `compose up` — see
    # docs/pages/run-node.md.

volumes:
  logos-persistence:
