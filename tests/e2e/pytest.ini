[pytest]
addopts = -ra --strict-markers
testpaths = .
markers =
    two_node: needs two daemon containers in a shared docker network
    rln: needs the RLN modules and the LEZ testnet (testnet.lez.logos.co)
    rln_membership: needs an active RLN membership (E2E_RLN_MEMBERSHIP_DIR)
    fleet: sends through the live logos.test fleet
