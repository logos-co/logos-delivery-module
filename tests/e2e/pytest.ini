[pytest]
addopts = -ra --strict-markers
testpaths = .
markers =
    two_node: needs two daemon containers in a shared docker network
    rln: needs the RLN modules, and a local LEZ chain (E2E_LEZ_RLN_DIR, E2E_LEZ_SEQUENCER_IMAGE) unless marked fleet
    fleet: sends through the live logos.test fleet, on the LEZ testnet (testnet.lez.logos.co)
