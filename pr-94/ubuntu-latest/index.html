, "note": "Wrote waku-config.json", "status": "pass"}], "md": "### 4.1 Write the node config\n\nCreate `waku-config.json` \u2014 a `logos.dev` network configuration for the\ndelivery node: cluster 2 with 8 auto-shards, relay/filter/lightpush\nenabled, mix routing, and discv5 discovery.\n\n> Extended Kademlia discovery (`enableKadDiscovery` +\n> `kadBootstrapNodes`) is intentionally omitted here. The node's\n> `start` performs a **blocking** Kademlia DHT bootstrap that only\n> returns once the DHT is joined; in a headless/CI run that bootstrap\n> does not complete, so `start` never returns and the call times out.\n> discv5 (plus the relay/rendezvous peers) is enough to join the\n> network for this doc-test. See `tests/test_delivery_start_hang.cpp`.\n\n```json\n{\n  \"tcpPort\": 30303,\n  \"discv5UdpPort\": 9000,\n  \"nodekey\": \"b9800176f31e41304dff5d385944c349300204361fca56beec956b7181fbc5ae\",\n  \"clusterId\": 2,\n  \"numShardsInNetwork\": 8,\n  \"maxConnections\": 300,\n  \"relay\": true,\n  \"store\": false,\n  \"filter\": true,\n  \"lightpush\": true,\n  \"logLevel\": \"DEBUG\",\n  \"websocketSupport\": true,\n  \"websocketPort\": 8000,\n  \"websocketSecureSupport\": false,\n  \"discv5Discovery\": true,\n  \"mix\": true,\n  \"mixkey\": \"fc2d71d52cdd37cb49cca3f6a8e6877f40bc999ed67ab5808bb3b9f685cf0f94\",\n  \"nat\": \"extip:138.68.122.137\",\n  \"extMultiaddrs\": [\"/dns4/delivery-01.do-ams3.logos.dev.status.im/tcp/30303\"]\n}\n```"}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.2 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`."}, {"execs": [{"cmd": "sleep 3", "exit_code": 0, "kind es\\\": [\\\"/dns4/\u2026\\\"] }\\n}\\n@endcode\\n\\nOn kernel-only nodes `send` / `subscribe` / `channel*` fail with \\\"node has\\nno messaging client\\\" / \\\"no reliable channel manager\\\"; `getNodeInfo`,\\n`storeQuery` and metrics keep working.\\n\\nThe pre-layered flat shape (bare `WakuNodeConf` keys at top level) still\\nparses and boots the full stack.\\n\\n@param cfg UTF-8 JSON payload string.\\n@return `true` if context creation succeeds and callback returns `RET_OK`,\\notherwise `false`.\",\"isInvokable\":true,\"name\":\"createNode\",\"parameters\":[{\"name\":\"cfg\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"createNode(QString)\"},{\"description\":\"@brief Starts the delivery node.\\n@return `true` once dispatched; completion is reported via `nodeStarted`.\",\"isInvokable\":true,\"name\":\"start\",\"returnType\":\"LogosResult\",\"signature\":\"start()\"},{\"description\":\"@brief Stops the delivery node.\\n@return `true` once dispatched; completion is reported via `nodeStopped`.\",\"isInvokable\":true,\"name\":\"stop\",\"returnType\":\"LogosResult\",\"signature\":\"stop()\"},{\"description\":\"@brief Sends a message over the active node.\\n\\nBuilds a JSON envelope expected by `logosdelivery_send`:\\n`{ \\\"contentTopic\\\": string, \\\"payload\\\": base64, \\\"ephemeral\\\": false }`.\\n\\nReturns a requestId on success. Async results come via typed events:\\n- `messageError` emitted if the module can't send the message\\n- `messagePropagated` emitted if the message has hit the network\\n- `messageSent` emitted after the message is validated by the network\\n\\n@param contentTopic Destination content topic.\\n@param payload Raw message bytes; base64-encoded before crossing the FFI boundary.\\n@return Success with request id, or error details.\",\"isInvokable\":true,\"name\":\"send\",\"parameters\":[{\"name\":\"contentTopic\",\"type\":\"QString\"},{\"name\":\"payload\",\"type\":\"QByteArray\"}],\"returnType\":\"LogosResult\", ber/string   | no       | Range start, nanoseconds since Unix epoch          |\\n| `timeEnd`           | number/string   | no       | Range end, nanoseconds since Unix epoch            |\\n| `messageHashes`     | array of string | no       | Hex message hashes for lookup-by-hash queries      |\\n| `paginationCursor`  | string          | no       | Hex cursor from a previous response                |\\n| `paginationLimit`   | number          | no       | Max messages per page                              |\\n\\nOn success the result value is the response JSON (`StoreQueryResponseHex`):\\n`{ \\\"requestId\\\", \\\"statusCode\\\", \\\"statusDesc\\\", \\\"messages\\\": [ { \\\"messageHash\\\",\\n\\\"message\\\", \\\"pubsubTopic\\\" } ], \\\"paginationCursor\\\" }` with hashes 0x-hex\\nencoded.\\n\\n@param jsonQuery UTF-8 JSON query document, see above.\\n@param peerAddr Multiaddress of the store service peer to query\\n(e.g. `/ip4/127.0.0.1/tcp/60000/p2p/16Uiu2...`).\\n@param timeoutMs Query timeout in milliseconds.\\n@return Success with the response JSON, or error details.\",\"isInvokable\":true,\"name\":\"storeQuery\",\"parameters\":[{\"name\":\"jsonQuery\",\"type\":\"QString\"},{\"name\":\"peerAddr\",\"type\":\"QString\"},{\"name\":\"timeoutMs\",\"type\":\"int\"}],\"returnType\":\"LogosResult\",\"signature\":\"storeQuery(QString,QString,int)\"},{\"description\":\"@brief Creates (or re-opens) a reliable channel.\\n\\nPersisted channel state survives @ref channelClose, so re-creating a\\nchannel with the same id restores it.\\n\\n@param channelId Application-chosen channel identifier.\\n@param contentTopic Content topic the channel communicates on.\\n@param senderId This participant's SDS (Scalable Data Sync) sender identifier.\\n@return Success with the channel id, or error details.\",\"isInvokable\":true,\"name\":\"channelCreate\",\"parameters\":[{\"name\":\"channelId\",\"type\":\"QString\"},{\"name\":\"contentTopic\",\"type\":\"QString\"},{\"name\":\"senderId\",\"t <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
