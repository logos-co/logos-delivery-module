name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      # Stage the module's complete DLL closure, installable layout, and CLI host.
      targets: default install-portable windows-logoscore
      assemble: '{"install-portable": ["default/lib", "windows-logoscore/bin"]}'
      # Exercise the RLN-off load/createNode calls from the runtime doctest.
      smoke-file: scripts/windows-smoke.sh
      wine-smoke: false
