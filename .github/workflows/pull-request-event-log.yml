name: Pull request event log

# Logs each pull_request event a PR receives (the same events ci.yml runs on),
# without a concurrency group, so that every event leaves its own run. Something
on:
  pull_request:
    branches: [master, main]

jobs:
  log-event:
    runs-on: ubuntu-latest
    steps:
      - name: Log the event
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "merge commit: $MERGE_SHA"
          jq '{action, before, after, head: .pull_request.head.sha, base: .pull_request.base.ref, stack: .pull_request.stack}' "$GITHUB_EVENT_PATH"
