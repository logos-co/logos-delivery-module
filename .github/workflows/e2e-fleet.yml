name: E2E fleet

# Joins the live logos.test fleet. Kept off PRs so that they do not depend on it.
on:
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

# Runs queue: each sends with the CI RLN membership through the fleet, and reads the
# last epoch the previous one sent in.
concurrency:
  group: e2e-fleet
  cancel-in-progress: false

jobs:
  e2e-fleet:
    # Only on master: a branch's cache entries are invisible to master's runs, so a run
    # elsewhere would send without the epoch record master's runs go by.
    if: github.ref == 'refs/heads/master'
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up e2e environment
        uses: ./.github/actions/setup-e2e
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
      - name: Restore the RLN membership
        uses: ./.github/actions/restore-rln-membership
        with:
          rln-keystore: ${{ secrets.RLN_KEYSTORE }}

      # The last RLN epoch a fleet run sent in. Entries can't be overwritten, so each run
      # saves its own and the newest one is restored.
      - name: Restore the last fleet epoch
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fleet-epoch
          key: e2e-fleet-epoch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: e2e-fleet-epoch-

      - name: Run the fleet tests
        run: |
          mkdir -p ${{ runner.temp }}/e2e-logs
          cd tests/e2e
          pytest -v -m fleet
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          E2E_FLEET_EPOCH_FILE: ${{ runner.temp }}/fleet-epoch/epoch

      # The record the next run reads: written here so that a failed or cancelled run
      # leaves one too. 600 s is the RLN epoch.
      - name: Record the last fleet epoch
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/fleet-epoch
          echo $(( $(date +%s) / 600 )) > ${{ runner.temp }}/fleet-epoch/epoch

      - name: Save the last fleet epoch
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fleet-epoch
          key: e2e-fleet-epoch-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fleet-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7
