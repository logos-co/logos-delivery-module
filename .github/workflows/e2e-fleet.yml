name: E2E fleet

# The fleet tests join the live logos.test fleet, so PRs don't run them and don't depend on it.
on:
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

# Runs queue instead of overlapping, because each run sends with the same RLN membership
# and reads the last epoch the previous run sent in.
concurrency:
  group: e2e-fleet
  cancel-in-progress: false

jobs:
  e2e-fleet:
    # Only on master, so that every run reads the epoch the previous run saved.
    if: github.ref == 'refs/heads/master'
    environment: public-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up e2e environment
        uses: ./.github/actions/setup-e2e
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Restore the RLN membership
        uses: ./.github/actions/restore-rln-membership
        with:
          rln-keystore: ${{ secrets.RLN_KEYSTORE }}

      # The last RLN epoch a fleet run sent in.
      - name: Restore the last fleet epoch
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fleet-epoch
          key: e2e-fleet-epoch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: e2e-fleet-epoch-

      - name: Run the fleet tests
        run: |
          mkdir -p ${{ runner.temp }}/e2e-logs
          cd tests/e2e
          pytest -v -m fleet
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          E2E_FLEET_EPOCH_FILE: ${{ runner.temp }}/fleet-epoch/epoch

      # This step records the epoch even when the run fails or is cancelled.
      - name: Record the last fleet epoch
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/fleet-epoch
          echo $(( $(date +%s) / 600 )) > ${{ runner.temp }}/fleet-epoch/epoch

      - name: Save the last fleet epoch
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fleet-epoch
          key: e2e-fleet-epoch-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fleet-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7
