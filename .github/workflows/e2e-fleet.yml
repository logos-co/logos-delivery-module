name: E2E fleet

# Joins the live logos.test fleet. Kept off PRs so that they do not depend on it.
on:
  push:
    branches: [test-4]  # temporary, remove before merge
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Runs queue: each sends with the CI RLN membership through the fleet, and two runs
# must not send in the same epoch.
concurrency:
  group: e2e-fleet
  cancel-in-progress: false

env:
  # The logos-logoscore-py commit of the e2e smoke image and the Python client, as in ci.yml.
  LOGOSCORE_PY_REV: edfe322c2f9e2d54962da752451d1609dcbe3fbf

jobs:
  e2e-fleet:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up e2e environment
        uses: ./.github/actions/setup-e2e
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          logoscore-py-rev: ${{ env.LOGOSCORE_PY_REV }}

      - name: Restore the RLN membership
        uses: ./.github/actions/restore-rln-membership
        with:
          rln-keystore: ${{ secrets.RLN_KEYSTORE }}

      - name: Run the fleet tests
        run: |
          mkdir -p ${{ runner.temp }}/e2e-logs
          cd tests/e2e
          pytest -v -m fleet
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          LOGOSCTL_PY_FORWARD_OUTPUT: "1"

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fleet-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7
