name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The logos-logoscore-py commit of the e2e smoke image and the Python client.
  LOGOSCORE_PY_REV: edfe322c2f9e2d54962da752451d1609dcbe3fbf

jobs:
  build-and-test:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build module
        run: nix build -L

      - name: Run tests
        run: nix build .#unit-tests -L

  e2e-tests:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up e2e environment
        uses: ./.github/actions/setup-e2e
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          logoscore-py-rev: ${{ env.LOGOSCORE_PY_REV }}

      - name: Run e2e tests
        run: |
          mkdir -p ${{ runner.temp }}/e2e-logs
          cd tests/e2e
          pytest -v -n 4 --dist=loadgroup
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          LOGOSCTL_PY_FORWARD_OUTPUT: "1"

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7

  # The e2e tests with RLN membership. Not a required check: a failure never blocks a merge.
  e2e-rln-membership:
    # Fork PRs get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up e2e environment
        uses: ./.github/actions/setup-e2e
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          logoscore-py-rev: ${{ env.LOGOSCORE_PY_REV }}

      - name: Restore the RLN membership
        uses: ./.github/actions/restore-rln-membership
        with:
          rln-keystore: ${{ secrets.RLN_KEYSTORE }}

      - name: Run e2e tests
        run: |
          mkdir -p ${{ runner.temp }}/e2e-logs
          cd tests/e2e
          pytest -v -m "rln_membership and not fleet" -n 4 --dist=loadgroup
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          LOGOSCTL_PY_FORWARD_OUTPUT: "1"

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rln-membership-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7
