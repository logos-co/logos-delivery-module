name: Set up e2e environment
description: >
  Builds the logosctl smoke image (LOGOSCTL_IMAGE), the logosctl CLI (PATH) and the
  delivery module, installed with logosctl next to its released dependency modules
  (LOGOS_MODULES_DIR), and installs the Python test dependencies. The smoke image
  comes from the Actions cache when its pin is unchanged.

inputs:
  attic-token-ci:
    description: ATTIC_TOKEN_CI, for the Nix cache.
    required: true
  attic-token-public:
    description: ATTIC_TOKEN_PUBLIC, for the Nix cache.
    required: true
  logoscore-py-commit:
    description: The logos-logoscore-py commit of the smoke image and the Python client.
    default: 41bbc3b45f6a0691caed259683922163930afc49

runs:
  using: composite
  steps:
    - name: Setup Nix and Logos cache
      uses: logos-co/setup-nix-cache-action@v1
      with:
        attic-token-ci: ${{ inputs.attic-token-ci }}
        attic-token-public: ${{ inputs.attic-token-public }}

    - name: Restore the cached smoke image
      id: smoke-image
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/logosctl-smoke-image.tar
        key: logosctl-smoke-image-${{ runner.arch }}-${{ inputs.logoscore-py-commit }}

    # The default docker driver can't export to the gha cache backend.
    - name: Set up Docker Buildx
      if: steps.smoke-image.outputs.cache-hit != 'true'
      uses: docker/setup-buildx-action@v3

    # The buildx in build_smoke_image.sh needs ACTIONS_RUNTIME_TOKEN and
    # ACTIONS_CACHE_URL for the gha cache, and GitHub only gives them to actions.
    - name: Expose Actions runtime for buildx gha cache
      if: steps.smoke-image.outputs.cache-hit != 'true'
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Build delivery-module (lgx-portable)
      shell: bash
      run: |
        nix build -L .#lgx-portable

    - name: Load the cached smoke image
      if: steps.smoke-image.outputs.cache-hit == 'true'
      shell: bash
      run: |
        docker load -i "$RUNNER_TEMP/logosctl-smoke-image.tar"
        rm "$RUNNER_TEMP/logosctl-smoke-image.tar"
        echo "LOGOSCTL_IMAGE=logosctl:smoke-portable" >> $GITHUB_ENV

    - name: Checkout logoscore-py and build smoke image
      if: steps.smoke-image.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILDX_CACHE_FROM: type=gha
        BUILDX_CACHE_TO: type=gha,mode=max
      run: |
        git clone https://github.com/logos-co/logos-logoscore-py.git /tmp/logoscore-py
        cd /tmp/logoscore-py
        git checkout ${{ inputs.logoscore-py-commit }}
        bash tests/logosctl/docker_smoke/build_smoke_image.sh
        docker save logosctl:smoke-portable -o "$RUNNER_TEMP/logosctl-smoke-image.tar"
        echo "LOGOSCTL_IMAGE=logosctl:smoke-portable" >> $GITHUB_ENV

    - name: Save the smoke image
      if: steps.smoke-image.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/logosctl-smoke-image.tar
        key: ${{ steps.smoke-image.outputs.cache-primary-key }}

    # The image's own CLI, so the host client matches the daemon; through tar, because
    # `docker cp` to a directory fails on the bundle's read-only directories.
    - name: Copy the logosctl CLI out of the smoke image (host PATH)
      shell: bash
      run: |
        docker create --name logosctl-cli logosctl:smoke-portable
        docker cp logosctl-cli:/opt/logosctl - | tar -x -C "$RUNNER_TEMP"
        docker rm logosctl-cli
        echo "$RUNNER_TEMP/logosctl/bin" >> $GITHUB_PATH

    # The released dependencies at pinned versions, then this commit's module from
    # disk. liblogos_rln_module names liblogos_lez_rln_module without a version, so
    # lez is pinned on its own and rln installs without dependencies.
    - name: Install the modules with logosctl
      shell: bash
      env:
        LOGOSCTL_CONFIG_DIR: ${{ runner.temp }}/logosctl-modules
      run: |
        logosctl daemon start --detach
        logosctl catalog refresh
        logosctl install liblogos_lez_rln_module --version 5.1.0 -y
        logosctl install liblogos_rln_module --version 0.12.0 --no-deps -y
        logosctl install result/*.lgx -y
        logosctl daemon stop
        echo "LOGOS_MODULES_DIR=$LOGOSCTL_CONFIG_DIR/modules" >> $GITHUB_ENV

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: tests/e2e/requirements.txt

    # Replaces the logoscore@master that the framework pulls in with a pinned commit.
    - name: Install e2e test dependencies
      shell: bash
      run: |
        cd tests/e2e
        pip install -r requirements.txt
        pip install --no-deps --force-reinstall "logoscore @ git+https://github.com/logos-co/logos-logoscore-py.git@${{ inputs.logoscore-py-commit }}"
