name: Set up logos-lez-rln
description: >
  Builds logos-lez-rln's guest programs and its mint_payer, run_setup and fund_account
  tools in E2E_LEZ_RLN_DIR, from the Actions cache when the pins are unchanged. Pulls
  the LEZ sequencer image into E2E_LEZ_SEQUENCER_IMAGE.

inputs:
  sequencer-image:
    description: The standalone LEZ sequencer v0.3.1, the LEZ release the RLN modules use.
    default: harbor.status.im/logos-blockchain/logos-execution-zone/sequencer_service-standalone@sha256:b90dd1890b9b2d429a2793a69a1c98e0dcaf61db8e01a5cfd592eea0fa3c4688
  lez-rln-commit:
    description: The logos-lez-rln commit to build.
    default: 235ddaeee84eec385a2d4b68d69f702a29c14cf3
  cargo-risczero-version:
    description: The cargo-risczero that builds the guest programs.
    default: 3.0.5
  risc0-rust-version:
    description: The risc0 Rust toolchain cargo-risczero checks for.
    default: 1.88.0

runs:
  using: composite
  steps:
    # logos-lez-rln's tools link libpcsclite (keycard_wallet).
    - name: Install libpcsclite
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcsclite-dev

    - name: Restore the cached logos-lez-rln build
      id: lez-rln
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/mint_payer
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/run_setup
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/fund_account
          ${{ runner.temp }}/logos-lez-rln/lez-rln/methods/guest/target/riscv32im-risc0-zkvm-elf/docker/*.bin
        key: lez-rln-${{ runner.arch }}-${{ inputs.lez-rln-commit }}-cargo-risczero-${{ inputs.cargo-risczero-version }}-rust-${{ inputs.risc0-rust-version }}

    # The guest programs build in docker, but cargo-risczero still needs the risc0 Rust
    # toolchain installed.
    - name: Build logos-lez-rln
      if: steps.lez-rln.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -L https://risczero.com/install | bash
        "$HOME/.risc0/bin/rzup" install cargo-risczero ${{ inputs.cargo-risczero-version }}
        "$HOME/.risc0/bin/rzup" install rust ${{ inputs.risc0-rust-version }}
        export PATH="$HOME/.risc0/bin:$PATH"
        git clone https://github.com/logos-co/logos-lez-rln.git "$RUNNER_TEMP/logos-lez-rln"
        cd "$RUNNER_TEMP/logos-lez-rln"
        git checkout ${{ inputs.lez-rln-commit }}
        cargo risczero build --manifest-path lez-rln/methods/guest/Cargo.toml
        cargo build --release --manifest-path lez-rln/Cargo.toml --bin mint_payer --bin run_setup --bin fund_account

    - name: Save the logos-lez-rln build
      if: steps.lez-rln.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/mint_payer
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/run_setup
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/fund_account
          ${{ runner.temp }}/logos-lez-rln/lez-rln/methods/guest/target/riscv32im-risc0-zkvm-elf/docker/*.bin
        key: ${{ steps.lez-rln.outputs.cache-primary-key }}

    - name: Export E2E_LEZ_RLN_DIR
      shell: bash
      run: echo "E2E_LEZ_RLN_DIR=$RUNNER_TEMP/logos-lez-rln" >> "$GITHUB_ENV"

    - name: Pull the LEZ sequencer image
      shell: bash
      run: |
        docker pull ${{ inputs.sequencer-image }}
        echo "E2E_LEZ_SEQUENCER_IMAGE=${{ inputs.sequencer-image }}" >> "$GITHUB_ENV"
