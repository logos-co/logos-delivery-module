name: Set up logos-lez-rln
description: >
  Builds logos-lez-rln's guest programs and its mint_payer, run_setup and fund_account
  tools in E2E_LEZ_RLN_DIR, from the Actions cache when the pins are unchanged. Loads
  the LEZ sequencer image into E2E_LEZ_SEQUENCER_IMAGE from the Actions cache, the
  registry, or a build from source, in that order.

inputs:
  sequencer-image:
    description: The standalone LEZ sequencer.
    default: harbor.status.im/logos-blockchain/logos-execution-zone/sequencer_service-standalone:v0.3.2
  sequencer-ref:
    description: The logos-execution-zone tag that the sequencer image is built from when the registry is unreachable.
    default: v0.3.2
  recursion-zkr-url:
    description: >
      risc0-circuit-recursion's recursion_zkr.zip for that build. Its build script
      downloads it from risc0's S3 bucket, which answers 403.
    default: https://media.githubusercontent.com/media/risc0/risc0/v3.0.4/risc0/circuit/recursion/src/recursion_zkr.zip
  recursion-zkr-sha256:
    description: The SHA-256 that risc0-circuit-recursion checks recursion_zkr.zip against.
    default: 744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849
  lez-rln-commit:
    description: The logos-lez-rln commit to build.
    default: 235ddaeee84eec385a2d4b68d69f702a29c14cf3
  rzup-version:
    description: The rzup, from crates.io, that installs cargo-risczero and the risc0 Rust toolchain.
    default: 0.5.2
  cargo-risczero-version:
    description: The cargo-risczero that builds the guest programs.
    default: 3.0.5
  risc0-rust-version:
    description: The risc0 Rust toolchain cargo-risczero checks for.
    default: 1.88.0

runs:
  using: composite
  steps:
    - name: Require Linux
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error::setup-lez-rln supports Linux runners only"
        exit 1

    # logos-lez-rln's tools link libpcsclite (keycard_wallet).
    - name: Install libpcsclite
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcsclite-dev

    - name: Restore the cached logos-lez-rln build
      id: lez-rln
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/mint_payer
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/run_setup
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/fund_account
          ${{ runner.temp }}/logos-lez-rln/lez-rln/methods/guest/target/riscv32im-risc0-zkvm-elf/docker/*.bin
        key: lez-rln-${{ runner.arch }}-${{ inputs.lez-rln-commit }}-rzup-${{ inputs.rzup-version }}-cargo-risczero-${{ inputs.cargo-risczero-version }}-rust-${{ inputs.risc0-rust-version }}

    # The guest programs build in docker, but cargo-risczero still needs the risc0 Rust
    # toolchain installed.
    - name: Build logos-lez-rln
      if: steps.lez-rln.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install rzup --version ${{ inputs.rzup-version }} --locked
        rzup install cargo-risczero ${{ inputs.cargo-risczero-version }}
        rzup install rust ${{ inputs.risc0-rust-version }}
        git clone https://github.com/logos-co/logos-lez-rln.git "$RUNNER_TEMP/logos-lez-rln"
        cd "$RUNNER_TEMP/logos-lez-rln"
        git checkout ${{ inputs.lez-rln-commit }}
        cargo risczero build --manifest-path lez-rln/methods/guest/Cargo.toml
        cargo build --release --manifest-path lez-rln/Cargo.toml --bin mint_payer --bin run_setup --bin fund_account

    - name: Save the logos-lez-rln build
      if: steps.lez-rln.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/mint_payer
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/run_setup
          ${{ runner.temp }}/logos-lez-rln/lez-rln/target/release/fund_account
          ${{ runner.temp }}/logos-lez-rln/lez-rln/methods/guest/target/riscv32im-risc0-zkvm-elf/docker/*.bin
        key: ${{ steps.lez-rln.outputs.cache-primary-key }}

    - name: Export E2E_LEZ_RLN_DIR
      shell: bash
      run: echo "E2E_LEZ_RLN_DIR=$RUNNER_TEMP/logos-lez-rln" >> "$GITHUB_ENV"

    - name: Restore the cached LEZ sequencer image
      id: sequencer-image
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/lez-sequencer-image.tar
        key: lez-sequencer-${{ runner.arch }}-${{ inputs.sequencer-image }}-${{ inputs.sequencer-ref }}

    # Only the docker-driver builder sees the locally loaded risc0_base image.
    - name: Load, pull or build the LEZ sequencer image
      shell: bash
      env:
        IMAGE: ${{ inputs.sequencer-image }}
        REF: ${{ inputs.sequencer-ref }}
        ZKR_URL: ${{ inputs.recursion-zkr-url }}
        ZKR_SHA256: ${{ inputs.recursion-zkr-sha256 }}
        CACHE_HIT: ${{ steps.sequencer-image.outputs.cache-hit }}
      run: |
        set -euo pipefail
        tar="$RUNNER_TEMP/lez-sequencer-image.tar"
        if [ "$CACHE_HIT" = "true" ]; then
          docker load -i "$tar"
        elif timeout 120 docker pull "$IMAGE"; then
          docker save "$IMAGE" -o "$tar"
        else
          echo "::warning::could not pull $IMAGE; building it from logos-execution-zone $REF"
          src="$RUNNER_TEMP/logos-execution-zone"
          git clone --depth 1 --branch "$REF" https://github.com/logos-blockchain/logos-execution-zone.git "$src"
          docker buildx build --builder default --load -t lez-risc0-base-upstream \
            -f "$src/lez/docker/risc0-base.Dockerfile" "$src"
          zkr="$RUNNER_TEMP/risc0-zkr"
          mkdir -p "$zkr"
          curl -fsSL --retry 3 -o "$zkr/recursion_zkr.zip" "$ZKR_URL"
          echo "$ZKR_SHA256  $zkr/recursion_zkr.zip" | sha256sum -c -
          printf '%s\n' 'FROM lez-risc0-base-upstream' \
            'COPY recursion_zkr.zip /opt/risc0/recursion_zkr.zip' \
            'ENV RECURSION_SRC_PATH=/opt/risc0/recursion_zkr.zip' > "$zkr/Dockerfile"
          docker buildx build --builder default --load -t lez-risc0-base "$zkr"
          docker buildx build --builder default --load -t "$IMAGE" \
            --build-context risc0_base=docker-image://lez-risc0-base \
            --build-arg STANDALONE=true \
            -f "$src/lez/sequencer/service/Dockerfile" "$src"
          docker save "$IMAGE" -o "$tar"
        fi
        echo "E2E_LEZ_SEQUENCER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

    - name: Save the LEZ sequencer image
      if: steps.sequencer-image.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/lez-sequencer-image.tar
        key: ${{ steps.sequencer-image.outputs.cache-primary-key }}
